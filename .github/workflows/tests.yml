name: DEBE regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  production-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for Render auto-deploy
        run: sleep 75
      - name: Validate live Audi A5 research
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request

          params=urllib.parse.urlencode({
              'model':'Audi A5',
              'engine':'2.0 TDI 190 cv',
              'year':'2015',
              'fuel':'Diesel',
          })
          url='https://debe-auto.onrender.com/api/research?'+params
          last=None
          for _ in range(3):
              try:
                  with urllib.request.urlopen(url, timeout=95) as r:
                      data=json.load(r)
                  last=data
                  strengths=data.get('strengths') or []
                  issues=data.get('issues') or []
                  checks=data.get('checks') or []
                  generic_strength=any('não permitem destacar' in x.lower() or 'não foi possível' in x.lower() for x in strengths)
                  generic_issue=any('não permitem classificar' in x.lower() or 'não foi possível' in x.lower() for x in issues)
                  assert len(strengths)>=2 and not generic_strength, strengths
                  assert len(issues)>=1 and not generic_issue, issues
                  assert len(checks)>=3, checks
                  assert all('Recomenda-se' in x.get('detail','') for x in checks), checks
                  print(json.dumps({'strengths':strengths,'issues':issues,'checks':checks},ensure_ascii=False,indent=2))
                  break
              except Exception as e:
                  print('attempt failed:',repr(e))
                  time.sleep(20)
          else:
              raise SystemExit('Live DEBE research smoke test failed: '+repr(last))
          PY
      - name: Validate live BMW X4 extraction and comparables
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request

          listing_url='https://www.standvirtual.com/carros/anuncio/bmw-x4-ver-20-d-xdrive-auto-ID8Q0X1e.html'
          base='https://debe-auto.onrender.com'
          last=None
          for _ in range(3):
              try:
                  url=base+'/api/listing?'+urllib.parse.urlencode({'url':listing_url})
                  with urllib.request.urlopen(url, timeout=95) as r:
                      listing=json.load(r)
                  last=listing
                  assert listing.get('ok') is True, listing
                  assert 'BMW X4' in (listing.get('title') or ''), listing
                  assert listing.get('fuel') == 'Diesel', listing
                  assert str(listing.get('year') or '') == '2018', listing
                  assert '31.000' in (listing.get('price') or ''), listing
                  assert '68.000' in (listing.get('km') or ''), listing

                  params={
                      'model':listing.get('title') or 'BMW X4',
                      'fuel':listing.get('fuel') or 'Diesel',
                      'price':listing.get('price') or '31.000 €',
                      'year':listing.get('year') or '2018',
                      'url':listing_url,
                  }
                  with urllib.request.urlopen(base+'/api/comparables?'+urllib.parse.urlencode(params), timeout=95) as r:
                      market=json.load(r)
                  last=market
                  assert market.get('ok') is True, market
                  assert int(market.get('count') or 0) >= 1, market
                  print(json.dumps({'listing':listing,'comparables':market},ensure_ascii=False,indent=2))
                  break
              except Exception as e:
                  print('attempt failed:',repr(e),'last=',repr(last))
                  time.sleep(20)
          else:
              raise SystemExit('Live BMW X4 smoke test failed: '+repr(last))
          PY
