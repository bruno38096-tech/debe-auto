name: DEBE regression tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  production-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for Render auto-deploy
        run: sleep 75
      - name: Validate live Audi A5 research
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          params=urllib.parse.urlencode({'model':'Audi A5','engine':'2.0 TDI 190 cv','year':'2015','fuel':'Diesel'})
          url='https://debe-auto.onrender.com/api/research?'+params
          last=None
          for _ in range(3):
              try:
                  with urllib.request.urlopen(url, timeout=95) as r:data=json.load(r)
                  last=data; strengths=data.get('strengths') or []; issues=data.get('issues') or []; checks=data.get('checks') or []
                  assert len(strengths)>=2, strengths
                  assert len(issues)>=1, issues
                  assert len(checks)>=3, checks
                  break
              except Exception as e:
                  print('attempt failed:',repr(e)); time.sleep(20)
          else: raise SystemExit('Live DEBE research smoke test failed: '+repr(last))
          PY
      - name: Validate live BMW X4 extraction and comparables
        if: always()
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          listing_url='https://www.standvirtual.com/carros/anuncio/bmw-x4-ver-20-d-xdrive-auto-ID8Q0X1e.html'; base='https://debe-auto.onrender.com'; last=None
          for _ in range(3):
              try:
                  with urllib.request.urlopen(base+'/api/listing?'+urllib.parse.urlencode({'url':listing_url}), timeout=95) as r:listing=json.load(r)
                  last=listing
                  assert listing.get('ok') is True and 'BMW X4' in (listing.get('title') or ''), listing
                  assert listing.get('fuel') == 'Diesel' and str(listing.get('year') or '') == '2018', listing
                  params={'model':listing.get('title') or 'BMW X4','fuel':listing.get('fuel') or 'Diesel','price':listing.get('price') or '31.000 €','year':listing.get('year') or '2018','url':listing_url}
                  with urllib.request.urlopen(base+'/api/comparables?'+urllib.parse.urlencode(params), timeout=95) as r:market=json.load(r)
                  last=market; assert market.get('ok') is True and int(market.get('count') or 0)>=1, market
                  break
              except Exception as e:
                  print('attempt failed:',repr(e),'last=',repr(last)); time.sleep(20)
          else: raise SystemExit('Live BMW X4 smoke test failed: '+repr(last))
          PY
      - name: Validate public beta analytics and formal copy
        if: always()
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://debe-auto.onrender.com'
          with urllib.request.urlopen(base, timeout=30) as r:
              html=r.read().decode('utf-8')
          assert 'O seu copiloto na' in html, 'formal public-beta copy not active'
          body=json.dumps({'event':'page_view','session':'ci-smoke','utm_source':'github-actions'}).encode()
          req=urllib.request.Request(base+'/api/event',data=body,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req, timeout=30) as r:
              data=json.load(r)
          assert data.get('ok') is True, data
          print('Public beta analytics endpoint OK')
          PY
