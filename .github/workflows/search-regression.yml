name: DEBE Search regression checks

on:
  push:
    branches: [debe-search-poc]
  pull_request:
    branches: [debe-search-poc]

jobs:
  search-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py search_beta_app.py search_poc scripts
      - name: Run Search regression tests
        run: |
          python -m unittest discover -s tests -p 'test_search_regression.py' -v
          python -m unittest discover -s tests -p 'test_bmw_reader_fallback.py' -v
          python -m unittest discover -s tests -p 'test_standvirtual_reader.py' -v
          python -m unittest discover -s tests -p 'test_catalog_matrix.py' -v
          python -m unittest discover -s tests -p 'test_search_catalog_contract.py' -v
          python -m unittest discover -s tests -p 'test_inventory_cache.py' -v
          python -m unittest discover -s tests -p 'test_inventory_enrichment.py' -v
          python -m unittest discover -s tests -p 'test_a5_ehybrid_ui.py' -v

      - name: Validate Search JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib,re
          source=pathlib.Path("search_beta_app.py").read_text(encoding="utf-8")
          html=re.search(r"HTML=r'''(.*?)'''",source,re.S)
          if not html:raise SystemExit("Missing Search HTML template")
          match=re.search(r"<script>(.*?)</script>",html.group(1),re.S)
          if not match:raise SystemExit("Missing Search JavaScript")
          pathlib.Path("/tmp/debe-search.js").write_text(match.group(1),encoding="utf-8")
          PY
          node --check /tmp/debe-search.js



      - name: Probe A5 e-hybrid live Standvirtual pages
        run: |
          python - <<'PY'
          from search_poc.connectors.standvirtual import _reader_rows
          from search_poc.vehicle_identity import spec_matches
          seen=[]
          for slug in ('a5-avant','a5-limousine'):
              try:
                  url='https://www.standvirtual.com/carros/audi/'+slug+'?search%5Bfilter_enum_fuel_type%5D=plugin-hybrid'
                  cars=_reader_rows(url,'',timeout=15,limit=50,validate=False)
                  exact=[v for v in cars if spec_matches('Audi','A5','e-hybrid','all',v)]
                  print('A5_EHYBRID_PROBE',slug,'total',len(cars),'exact',len(exact),
                        'samples',[(v.get('title'),v.get('price_eur'),v.get('url')) for v in exact[:3]],flush=True)
                  seen.extend(exact)
              except Exception as exc:
                  print('A5_EHYBRID_SOURCE_ERROR',slug,str(exc)[:150],flush=True)
          if len({v['url'] for v in seen})<2:
              raise SystemExit('Insufficient live Audi A5 e-hybrid adverts retrieved')
          PY

      - name: Confirm live Audi A5 e-hybrid and mobile UI
        run: |
          python - <<'PY'
          import requests,time
          from search_poc.vehicle_identity import spec_matches
          origin='https://debe-search-beta.onrender.com/search-beta/'
          html=requests.get(origin,timeout=30)
          html.raise_for_status()
          for snippet in ('Encontra o carro certo.','Audi A5 e-hybrid','id="sort"','Pesquisar carros','Analisar anúncio'):
            assert snippet in html.text,snippet
          endpoint=origin+'api/search'
          cases=[
            dict(make='Audi',model='A5',variant='e-hybrid',body='all',condition='all'),
            dict(make='Audi',model='A5',variant='e-hybrid',body='station',condition='all'),
            dict(make='BMW',model='Série 3',variant='330e',body='station',condition='all'),
            dict(make='Mercedes-Benz',model='GLC',variant='GLC 300 e',body='suv',condition='all'),
          ]
          for params in cases:
            start=time.monotonic()
            r=requests.get(endpoint,params=params,timeout=45)
            r.raise_for_status()
            payload=r.json()
            rows=payload.get('results',[])
            invalid=[x.get('title') for x in rows if not spec_matches(params['make'],params['model'],params['variant'],params['body'],x)]
            print('PRODUCTION_A5_SMOKE',params,'count',len(rows),'seconds',round(time.monotonic()-start,1),
              'invalid',invalid,'dated',sum(bool(x.get('observed_at')) for x in rows),
              'sample',[(x.get('title'),x.get('price_eur'),x.get('url')) for x in rows[:3]],flush=True)
            assert not invalid,'Incorrect powertrain'
            assert len(rows)>=2,'No relevant adverts for selected engine'
          PY
