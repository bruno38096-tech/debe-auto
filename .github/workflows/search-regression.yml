name: DEBE Search regression checks

on:
  push:
    branches: [debe-search-poc]
  pull_request:
    branches: [debe-search-poc]

jobs:
  search-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py search_beta_app.py search_poc scripts
      - name: Run Search regression tests
        run: |
          python -m unittest discover -s tests -p 'test_search_regression.py' -v
          python -m unittest discover -s tests -p 'test_bmw_reader_fallback.py' -v
          python -m unittest discover -s tests -p 'test_standvirtual_reader.py' -v
          python -m unittest discover -s tests -p 'test_catalog_matrix.py' -v
          python -m unittest discover -s tests -p 'test_search_catalog_contract.py' -v
          python -m unittest discover -s tests -p 'test_inventory_cache.py' -v

      - name: Validate Search JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib,re
          source=pathlib.Path("search_beta_app.py").read_text(encoding="utf-8")
          html=re.search(r"HTML=r'''(.*?)'''",source,re.S)
          if not html:raise SystemExit("Missing Search HTML template")
          match=re.search(r"<script>(.*?)</script>",html.group(1),re.S)
          if not match:raise SystemExit("Missing Search JavaScript")
          pathlib.Path("/tmp/debe-search.js").write_text(match.group(1),encoding="utf-8")
          PY
          node --check /tmp/debe-search.js


      - name: Confirm live Search uses dated inventory for broad catalog
        run: |
          python - <<'PY'
          import requests,time
          from search_poc.vehicle_identity import spec_matches
          api="https://debe-search-beta.onrender.com/search-beta/api/search"
          tests=[
            ("Mercedes-Benz","GLC","AMG GLC 63","suv"),
            ("Mercedes-Benz","GLC","GLC 300 e","suv"),
            ("Audi","Q4 e-tron","","suv"),
            ("BMW","Série 3","330e","station"),
            ("Volvo","XC60","","suv"),
            ("Toyota","Corolla","","all"),
            ("Kia","Sportage","","suv"),
            ("Renault","Clio","","all"),
            ("Tesla","Model Y","","suv"),
            ("Porsche","911","","all"),
            ("Peugeot","208","","all"),
            ("Hyundai","Tucson","","suv"),
          ]
          valid_models=0
          errors=[]
          for make,model,variant,body in tests:
            t=time.monotonic()
            try:
              response=requests.get(api,params=dict(make=make,model=model,variant=variant,body=body,condition="all"),timeout=46)
              response.raise_for_status()
              data=response.json()
              rows=data.get("results",[])
              invalid=[x.get("title") for x in rows if not spec_matches(make,model,variant,body,x)]
              dated=sum(1 for x in rows if x.get("observed_at"))
              print("INVENTORY_LIVE",make,model,variant,"count",len(rows),
                    "snapshot_rows",dated,"seconds",round(time.monotonic()-t,1),
                    "status",data.get("stock_status"),"invalid",invalid,
                    "examples",[(x.get("title"),x.get("price_eur")) for x in rows[:2]],flush=True)
              if rows:valid_models+=1
              if invalid or (not rows and data.get("stock_status")!="not_confirmed"):
                errors.append((make,model,variant))
              if not data.get("source_links"):
                errors.append(("source links absent",make,model))
            except Exception as exc:errors.append((make,model,repr(exc)))
          print("SUCCESSFUL_MODELS",valid_models,"OF",len(tests),flush=True)
          if errors:raise SystemExit("INVALID SEARCH RESPONSE: "+repr(errors))
          if valid_models<7:raise SystemExit("Inventory is not reliably serving general searches")
          PY
