name: DEBE Search regression checks

on:
  push:
    branches: [debe-search-poc]
  pull_request:
    branches: [debe-search-poc]

jobs:
  search-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py search_beta_app.py search_poc
      - name: Run Search regression tests
        run: |
          python -m unittest discover -s tests -p 'test_search_regression.py' -v
          python -m unittest discover -s tests -p 'test_bmw_reader_fallback.py' -v
          python -m unittest discover -s tests -p 'test_standvirtual_reader.py' -v

      - name: Live search Q4 and GLC plus existing BMW and Audi
        run: |
          python - <<'PY'
          import requests,time,sys
          api="https://debe-search-beta.onrender.com/search-beta/api/search"
          searches=[
            dict(make="Audi",model="Q4 e-tron",variant="",body="suv",condition="all"),
            dict(make="Mercedes-Benz",model="GLC",variant="GLC 300 e",body="suv",condition="all"),
            dict(make="Mercedes-Benz",model="GLC",variant="",body="suv",condition="all"),
            dict(make="BMW",model="Série 3",variant="330e",body="station",condition="all"),
            dict(make="Audi",model="A6 e-tron",variant="",body="station",condition="all"),
          ]
          failed=[]
          for params in searches:
            started=time.monotonic()
            try:
              response=requests.get(api,params=params,timeout=40)
              response.raise_for_status()
              data=response.json()
              results=data.get("results",[])
              print("LIVE",params["make"],params["model"],params["variant"],"found",len(results),
                    "seconds",round(time.monotonic()-started,1),"partial",data.get("partial"),
                    "sources",[(v.get("key"),v.get("status"),v.get("count")) for v in data.get("sources",[])],
                    "offers",[(v.get("title"),v.get("price_eur"),v.get("url")) for v in results[:3]],flush=True)
              if not results:failed.append(str(params))
            except Exception as e:
              failed.append(str(params)+" "+repr(e))
          if failed:raise SystemExit("Live searches failed: "+"; ".join(failed))
          PY
