name: DEBE Search regression checks

on:
  push:
    branches: [debe-search-poc]
  pull_request:
    branches: [debe-search-poc]

jobs:
  search-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py search_beta_app.py search_poc scripts
      - name: Run Search regression tests
        run: |
          python -m unittest discover -s tests -p 'test_search_regression.py' -v
          python -m unittest discover -s tests -p 'test_bmw_reader_fallback.py' -v
          python -m unittest discover -s tests -p 'test_standvirtual_reader.py' -v
          python -m unittest discover -s tests -p 'test_catalog_matrix.py' -v
          python -m unittest discover -s tests -p 'test_search_catalog_contract.py' -v
          python -m unittest discover -s tests -p 'test_inventory_cache.py' -v

      - name: Validate Search JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib,re
          source=pathlib.Path("search_beta_app.py").read_text(encoding="utf-8")
          html=re.search(r"HTML=r'''(.*?)'''",source,re.S)
          if not html:raise SystemExit("Missing Search HTML template")
          match=re.search(r"<script>(.*?)</script>",html.group(1),re.S)
          if not match:raise SystemExit("Missing Search JavaScript")
          pathlib.Path("/tmp/debe-search.js").write_text(match.group(1),encoding="utf-8")
          PY
          node --check /tmp/debe-search.js



      - name: Confirm corrected BMW 330e and GLC plus AMG isolation
        run: |
          python - <<'PY'
          import requests,time
          from search_poc.vehicle_identity import spec_matches
          url="https://debe-search-beta.onrender.com/search-beta/api/search"
          checks=[
            ("BMW","Série 3","330e","station",3),
            ("Mercedes-Benz","GLC","GLC 300 e","suv",3),
            ("Mercedes-Benz","GLC","AMG GLC 63","suv",0),
          ]
          for make,model,variant,body,minimum in checks:
              t=time.monotonic()
              data=requests.get(url,params=dict(make=make,model=model,
                  variant=variant,body=body,condition="all"),timeout=45).json()
              offers=data.get("results",[])
              snapshots=sum(bool(x.get("observed_at")) for x in offers)
              violations=[x.get("title") for x in offers if not spec_matches(make,model,variant,body,x)]
              print("PRODUCTION_VARIANT",make,model,variant,"count",len(offers),
                "snapshots",snapshots,"seconds",round(time.monotonic()-t,1),
                "invalid",violations,"examples",[(x.get("title"),x.get("price_eur"),
                x.get("url")) for x in offers[:2]],flush=True)
              if len(offers)<minimum:raise SystemExit("No verified listings for "+variant)
              if violations:raise SystemExit("Wrong engine results "+repr(violations))
              if minimum and snapshots<minimum:raise SystemExit("Production snapshot not active for "+variant)
          PY
