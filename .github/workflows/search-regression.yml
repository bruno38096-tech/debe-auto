name: DEBE Search regression checks

on:
  push:
    branches: [debe-search-poc]
  pull_request:
    branches: [debe-search-poc]

jobs:
  search-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py search_beta_app.py search_poc scripts
      - name: Run Search regression tests
        run: |
          python -m unittest discover -s tests -p 'test_search_regression.py' -v
          python -m unittest discover -s tests -p 'test_bmw_reader_fallback.py' -v
          python -m unittest discover -s tests -p 'test_standvirtual_reader.py' -v
          python -m unittest discover -s tests -p 'test_catalog_matrix.py' -v
          python -m unittest discover -s tests -p 'test_search_catalog_contract.py' -v
          python -m unittest discover -s tests -p 'test_inventory_cache.py' -v
          python -m unittest discover -s tests -p 'test_inventory_enrichment.py' -v

      - name: Validate Search JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib,re
          source=pathlib.Path("search_beta_app.py").read_text(encoding="utf-8")
          html=re.search(r"HTML=r'''(.*?)'''",source,re.S)
          if not html:raise SystemExit("Missing Search HTML template")
          match=re.search(r"<script>(.*?)</script>",html.group(1),re.S)
          if not match:raise SystemExit("Missing Search JavaScript")
          pathlib.Path("/tmp/debe-search.js").write_text(match.group(1),encoding="utf-8")
          PY
          node --check /tmp/debe-search.js



      - name: Verify production listings for BMW 330e and GLC with AMG separation
        run: |
          python - <<'PY'
          import requests,time
          from search_poc.vehicle_identity import spec_matches
          api="https://debe-search-beta.onrender.com/search-beta/api/search"
          scenarios=[
            ("BMW","Série 3","330e","station",3),
            ("Mercedes-Benz","GLC","GLC 300 e","suv",3),
            ("Mercedes-Benz","GLC","AMG GLC 63","suv",0),
          ]
          for make,model,variant,body,minimum in scenarios:
              begin=time.monotonic()
              r=requests.get(api,params=dict(make=make,model=model,variant=variant,body=body,condition="all"),timeout=45)
              r.raise_for_status()
              d=r.json()
              ads=d.get("results",[])
              dated=sum(1 for a in ads if a.get("observed_at"))
              bad=[a.get("title") for a in ads if not spec_matches(make,model,variant,body,a)]
              print("LIVE_EXACT",make,model,variant,"count",len(ads),
                    "dated",dated,"seconds",round(time.monotonic()-begin,1),
                    "bad",bad,"samples",[(a.get("title"),a.get("price_eur")) for a in ads[:3]],flush=True)
              if len(ads)<minimum:raise SystemExit("Missing live listings for "+variant)
              if dated<minimum:raise SystemExit("Snapshot not published for "+variant)
              if bad:raise SystemExit("Wrong engine returned: "+str(bad))
          PY
