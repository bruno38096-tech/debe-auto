name: DEBE Search regression checks

on:
  push:
    branches: [debe-search-poc]
  pull_request:
    branches: [debe-search-poc]

jobs:
  search-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py search_beta_app.py search_poc
      - name: Run Search regression tests
        run: |
          python -m unittest discover -s tests -p 'test_search_regression.py' -v
          python -m unittest discover -s tests -p 'test_bmw_reader_fallback.py' -v

      - name: Probe direct Reader feeds
        run: |
          python - <<'PY'
          import requests, time
          from search_poc.connectors.bmw_reader_fallback import parse_bmw_reader
          urls=[
            'https://r.jina.ai/https://bmwpremiumselection.bmw.pt/carros-usados/bmw-serie-3/330e-touring/',
            'https://r.jina.ai/https://www.standvirtual.com/carros/audi/a6-avant-e-tron',
          ]
          for u in urls:
              try:
                  t=time.monotonic()
                  r=requests.get(u,timeout=22)
                  print("READER",u,"status",r.status_code,"elapsed",round(time.monotonic()-t,1),
                        "chars",len(r.text),"offers",len(parse_bmw_reader(r.text)),
                        "preview",repr(r.text[:250]),flush=True)
              except Exception as e:
                  print("READER FAILED",u,repr(e),flush=True)
          PY
      - name: Live search smoke test (BMW and Audi)
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import requests, time, sys
          base='https://debe-search-beta.onrender.com/search-beta/api/search'
          examples=[
              dict(make='BMW', model='Série 3', variant='330e', body='station', condition='all'),
              dict(make='Audi', model='A6 e-tron', variant='', body='station', condition='all'),
          ]
          failures=[]
          for params in examples:
              t=time.monotonic()
              response=requests.get(base,params=params,timeout=50)
              print("URL",response.url,"HTTP",response.status_code,"elapsed",round(time.monotonic()-t,1),flush=True)
              response.raise_for_status()
              data=response.json()
              print("QUERY",data.get('query'),"RESULTS",data.get('summary',{}).get('total'),
                    "SOURCE_STATS",[(v['key'],v.get('count'),v.get('status')) for v in data.get('sources',[])],
                    "PARTIAL",data.get('partial'),flush=True)
              if not data.get('results'):
                  failures.append(params['make']+' '+params['model'])
          if failures:
              print("EMPTY REAL SEARCHES: "+", ".join(failures),flush=True)
              sys.exit(1)
          PY
